name: Watch Auth Pro Research Update

on:
  push:
    branches:
      - main
    paths:
      - .github/research-update-v2.53.0.trigger

permissions:
  contents: write

jobs:
  update-reference-database:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Apply researched mappings
        run: python tools/apply_research_v2_53.py
      - name: Verify JavaScript
        run: |
          node --check data/watch-reference-data.js
          node --check app.js
          grep -q "2543C1A7" data/watch-reference-data.js
          grep -q "W20090X8" data/watch-reference-data.js
          grep -q "2518.30.00" data/watch-reference-data.js
      - name: Commit update
        run: |
          if git diff --quiet; then
            echo "No changes required"
            exit 0
          fi
          git config user.name "watch-auth-pro-research-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/watch-reference-data.js app.js
          git commit -m "Research and add missing watch references v2.53.0"
          git push
