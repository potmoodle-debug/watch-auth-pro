name: Install TAG Calibre 11 reminder

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/install-tag-calibre-11-reminder.yml'

permissions:
  contents: write

jobs:
  patch-index:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Add TAG Calibre 11 reminder script
        shell: python
        run: |
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          script = '    <script src="features/tag-calibre-11-reminder-v2651.js"></script>'

          if script not in text:
              marker = '    <script src="app.js"></script>'
              if marker not in text:
                  raise SystemExit('Could not find app.js script marker in index.html')
              text = text.replace(marker, marker + '\n' + script, 1)
              path.write_text(text, encoding='utf-8')

      - name: Commit index update
        run: |
          if git diff --quiet -- index.html; then
            echo "TAG Calibre 11 reminder is already installed."
            exit 0
          fi
          git config user.name "watch-auth-pro-bot"
          git config user.email "watch-auth-pro-bot@users.noreply.github.com"
          git add index.html
          git commit -m "Load TAG Calibre 11 automatic reminder"
          git push
