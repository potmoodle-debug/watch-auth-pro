name: Install temporary Ginza safeguard

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/install-ginza-temporary.yml'

permissions:
  contents: write

jobs:
  patch-index:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Add Ginza temporary script to Watch Auth Pro
        shell: python
        run: |
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          script = '    <script src="features/ginza-temporary-v2641.js"></script>'

          if script not in text:
              marker = '    <script src="app.js"></script>'
              if marker not in text:
                  raise SystemExit('Could not find app.js script marker in index.html')
              text = text.replace(marker, marker + '\n' + script, 1)
              path.write_text(text, encoding='utf-8')

      - name: Commit index update
        run: |
          if git diff --quiet -- index.html; then
            echo "Ginza script is already installed."
            exit 0
          fi
          git config user.name "watch-auth-pro-bot"
          git config user.email "watch-auth-pro-bot@users.noreply.github.com"
          git add index.html
          git commit -m "Load temporary Ginza safeguard"
          git push
