name: Update Ginza note bullets
on:
  push:
    paths:
      - '.github/workflows/update-ginza-bullets.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Make Ginza note additions bullet points
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('features/ginza-temporary-v2641.js')
          s = p.read_text()
          old = """    return changes.length ? `Component changes: ${changes.join('; ')}.` : '';"""
          new = """    return changes.length ? `Component changes:\n${changes.map(change => `• ${change}`).join('\\n')}` : '';"""
          if old not in s:
              raise SystemExit('buildChangeText target not found')
          s = s.replace(old, new, 1)
          old_css = """      .ginza-temp-summary-text { font-size:13px; line-height:1.55; color:#d1d5db; }"""
          new_css = """      .ginza-temp-summary-text { font-size:13px; line-height:1.65; color:#d1d5db; white-space:pre-line; }"""
          if old_css not in s:
              raise SystemExit('summary CSS target not found')
          s = s.replace(old_css, new_css, 1)
          p.write_text(s)
          Path('.github/workflows/update-ginza-bullets.yml').unlink()
          PY
      - name: Commit update
        run: |
          git config user.name "potmoodle-debug"
          git config user.email "potmoodle@gmail.com"
          git add features/ginza-temporary-v2641.js .github/workflows/update-ginza-bullets.yml
          git commit -m "Show Ginza authentication changes as bullet points"
          git push
